_2026-11-04","target":"ev_2026-11-04_0","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_1","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_2","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_3","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_4","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_5","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_6","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_7","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_8","weight":2},{"source":"d_2026-11-04","target":"ev_2026-11-04_9","weight":2},{"source":"core","target":"lt_0","weight":1},{"source":"core","target":"lt_1","weight":1},{"source":"core","target":"lt_2","weight":1},{"source":"core","target":"lt_3","weight":1},{"source":"core","target":"p_0","weight":2},{"source":"core","target":"p_1","weight":2},{"source":"core","target":"p_2","weight":2},{"source":"core","target":"p_3","weight":2},{"source":"core","target":"p_4","weight":2}]};
const COLORS = {core:'#ffd76a',knowledge:'#52d6c8',emotion:'#ff7ac8',day:'#6aa8ff',event:'#9b8cff',longterm:'#ffb36a',persona:'#f0a35e'};
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

// ---- layout: knowledge ring left, days right, emotions bottom, events around their day ----
const nodes=DATA.nodes.map(n=>({...n,x:0,y:0,vx:0,vy:0}));
const byId=Object.fromEntries(nodes.map((n,i)=>[n.id,i]));
const R=Math.min(W,H)*0.34;
const kn=nodes.filter(n=>n.kind==='knowledge');
const days=nodes.filter(n=>n.kind==='day');
const emos=nodes.filter(n=>n.kind==='emotion');
const lts=nodes.filter(n=>n.kind==='longterm');
const evs=nodes.filter(n=>n.kind==='event');
const core=nodes.find(n=>n.id==='core');
core.x=-W*0.02;core.y=0;
kn.forEach((n,i)=>{const a=i/kn.length*Math.PI*2;n.x=core.x+Math.cos(a)*R*0.72;n.y=core.y+Math.sin(a)*R*0.72;});
emos.forEach((n,i)=>{const a=Math.PI*0.5+i*(Math.PI*2/3);n.x=core.x+Math.cos(a)*R*0.42;n.y=core.y+Math.sin(a)*R*0.42;});
days.forEach((n,i)=>{n.x=W*0.27+(i%2)*130;n.y=-H*0.12+i*190;});
evs.forEach((n,i)=>{
  const day=nodes.find(d=>d.kind==='day'&&n.id.startsWith('ev_'+d.label));
  const base=day||core;
  const a=(i%9)/9*Math.PI*2;n.x=base.x+Math.cos(a)*90;n.y=base.y+Math.sin(a)*90;
});
lts.forEach((n,i)=>{n.x=-W*0.30+i*W*0.22;n.y=H*0.36;});

const links=DATA.links.filter(l=>byId[l.source]!==undefined&&byId[l.target]!==undefined)
 .map(l=>({s:byId[l.source],t:byId[l.target],w:l.weight||1}));
document.getElementById('stat').textContent='节点 '+nodes.length+' · 连接 '+links.length;

// ---- force ----
function step(){
  const k=0.00018, rep=nodes.length>25?900:1600;
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
    const a=nodes[i],b=nodes[j];let dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy+1;
    const f=rep/d2,d=Math.sqrt(d2);dx/=d;dy/=d;
    a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f;
  }
  for(const n of nodes){n.vx+=-n.x*k;n.vy+=-n.y*k;}
  for(const l of links){
    const a=nodes[l.s],b=nodes[l.t];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const f=(d-150)*0.0018*l.w;dx/=d;dy/=d;
    a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f;
  }
  for(const n of nodes){n.vx*=.88;n.vy*=.88;n.x+=n.vx;n.y+=n.vy;}
}

// ---- interaction ----
let spin=0.0009,drag=false,lx=0,ly=0,zoom=1,mx=-9999,my=-9999,hov=null;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('mouseup',()=>drag=false);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!drag)return;spin+=(e.clientX-lx)*0.00012;lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.35,Math.min(2.6,zoom*(e.deltaY>0?.92:1.08)));},{passive:false});
canvas.addEventListener('mouseleave',()=>{mx=-9999;my=-9999;});

function nodeAt(px,py){
  let best=null,bd=26;
  for(const n of nodes){
    const dx=n.x-((px-W/2)/zoom),dy=n.y-((py-H/2)/zoom);
    const d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=n;}
  }
  return best;
}

const hoverEl=document.getElementById('hover');
let frameT=0;
function draw(){
  ctx.clearRect(0,0,W,H);
  // star dust
  ctx.save();
  for(let i=0;i<90;i++){
    const x=(i*137.5)%W,y=(i*89.7)%H;
    ctx.fillStyle='rgba(140,180,255,'+(0.05+0.05*Math.sin(frameT*0.002+i))+')';
    ctx.fillRect(x,y,1,1);
  }
  ctx.restore();

  const h=nodeAt(mx,my);hov=h;
  const neighbors=new Set();
  if(h){neighbors.add(h.id);links.forEach(l=>{if(nodes[l.s].id===h.id)neighbors.add(nodes[l.t].id);if(nodes[l.t].id===h.id)neighbors.add(nodes[l.s].id);});}

  ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.rotate(0);
  for(const l of links){
    const a=nodes[l.s],b=nodes[l.t];
    const hi=hov&&(a.id===hov.id||b.id===hov.id);
    ctx.strokeStyle=hi?'rgba(255,230,150,.55)':'rgba(120,170,255,'+(0.07+l.w*0.14)+')';
    ctx.lineWidth=hi?2:0.7+l.w*0.8;
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
  for(const n of nodes){
    const c=COLORS[n.kind]||'#9b8cff';
    const base=n.kind==='core'?15:n.kind==='day'?8:n.kind==='emotion'?8:n.kind==='event'?4:n.kind==='longterm'?5.5:6;
    const pulse=1+0.12*Math.sin(frameT*0.0025+(n.x+n.y)*0.003);
    const r=base*(n.id===hov?.id?1.5:1)*pulse;
    const dim=hov&&!neighbors.has(n.id);
    ctx.globalAlpha=dim?0.28:1;
    const g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,r*4);
    g.addColorStop(0,c);g.addColorStop(.3,c+'66');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,r*4,0,7);ctx.fill();
    ctx.fillStyle=c;ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
    if(n.kind==='core'||n.kind==='day'||n.kind==='knowledge'||n.kind==='emotion'||n.kind==='longterm'){
      ctx.fillStyle='rgba(215,232,255,'+(dim?0.25:0.82)+')';
      ctx.font=(n.kind==='core'?'13px':'10px')+' "Microsoft YaHei"';
      ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y+(nodes.indexOf(n)%2===1?r+13:-r-7));
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();

  if(hov){
    hoverEl.style.display='block';
    hoverEl.style.left=Math.min(W-300,hov.x*zoom+W/2+14)+'px';
    hoverEl.style.top=Math.min(H-120,hov.y*zoom+H/2+14)+'px';
    hoverEl.innerHTML='<b style="color:'+(COLORS[hov.kind]||'#fff')+'">'+hov.label+'</b><br>'+
      ({core:'核心 · 本鲸鱼娘本人',knowledge:'知识 · research-tpu',emotion:'情绪 · 此刻的三值',day:'日档 · 那一日的事',event:'事件 · 日档里的一条',longterm:'长期 · 提炼过的一条',persona:'人格 · 维多利亚蒸馏'}[hov.kind]||'');
  } else hoverEl.style.display='none';
}

function frame(){frameT++;step();draw();requestAnimationFrame(frame);}
frame();
</script>
