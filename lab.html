l":"24G 单孔，TPU/DMF 10 wt%，去离子水 500 mL、室温，6.2 mL/h，垂直浸入、无气隙。","result":"断面实心。10 wt% 在 24G 上不出腔。"},{"date":"2026-11-09","title":"24G / 12 wt% / 纯水 / 垂直湿法 · 复现成腔（第二次验证）","status":"成功","detail":"24G 单孔（内径约 0.34 mm），TPU/DMF 12 wt%，去离子水浴 500 mL 室温，针头垂直浸入、无空气隙、无任何添加剂，6.2 mL/h。","result":"仍然出中空。第一条成腔方法可重复——同一天上午 DMF 浴失败、下午纯水这张能成，说明装置与操作没问题，DMF 是问题本身。"},{"date":"2026-11-09","title":"DMF 凝固浴改进（尝试后否决）","status":"未成功","detail":"凝固浴加 DMF（3 / 5 / 8 vol% 三档方案），垂直浸入、无气隙、24G 针头。","result":"纤维无法形成圆形截面、不能维持形状，纺丝不连续。判定 DMF 浴不可用，取消该改进。"},{"date":"2026-11-05","title":"原始方案 · B3（24G，12 wt%，纯水，6.2 mL/h）","status":"成功","detail":"未加空气隙、未加 DMF 浴的原始条件。24G 单孔，TPU/DMF 12 wt%，去离子水浴，6.2 mL/h。","result":"确认中空纤维——成腔成立。今天唯一成功的一组（纯水浴）。"},{"date":"2026-11-05","title":"原始方案 · A4（30G，10 wt%，水:乙醇 6:4，6.2 mL/h）","status":"未成功","detail":"未加空气隙、未加 DMF 浴。30G 单孔，水:乙醇 6:4 凝固浴，6.2 mL/h。","result":"实心，无腔。"},{"date":"2026-11-05","title":"原始方案 · B4（24G，12 wt%，水:乙醇 6:4，6.2 mL/h）","status":"未成功","detail":"未加空气隙、未加 DMF 浴。24G 单孔，水:乙醇 6:4 凝固浴，6.2 mL/h。","result":"实心，无腔。40% 乙醇浴反而没成。"},{"date":"2026-11-05","title":"原始方案 · C 对照（30G，15 wt%，水:乙醇 6:4，15 mL/h）","status":"未成功","detail":"未加空气隙、未加 DMF 浴。30G 单孔，15 wt% TPU/DMF，水:乙醇 6:4 凝固浴，15 mL/h。","result":"实心，与 2026-11-04 的记录一致。"},{"date":"2026-11-04","title":"理论补课：相转化 / 干-湿纺 / 溶剂-非溶剂","status":"成功","detail":"读《膜技术基本原理》第 2 版（Mulder 著，清华大学出版社 1999；PDF 页 = 书页 + 15），梳理相转化五法、喷丝头与空气隙、凝固浴作用。","result":"建立 hollow-fiber 知识库理论支（5 条），后续实验按此校准。"}],"sim":[{"date":"2026-11-06 实验单","title":"明日五组（24G 主攻 · 空气隙 × DMF 双变量）","desc":"指数为模拟预测，按此排序动手；第 2、3 组是拆开看谁在起作用的对照。","rows":[{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6.2","mods":"气隙5 + DMF5%","idx":"0.921"},{"needle":"24G","conc":"10 wt%","bath":"纯水","q":"6.2","mods":"气隙5 + DMF5%","idx":"0.913"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6.2","mods":"气隙0 + DMF5%","idx":"0.894"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6.2","mods":"气隙5 + 无DMF","idx":"0.872"},{"needle":"24G","conc":"12 wt%","bath":"醇6:4","q":"6.2","mods":"气隙5 + 无DMF","idx":"0.774"}]},{"date":"2026-11-05","title":"两改进叠加 · 可行性排序（前 8，校准前）","desc":"指数 = 六因子 + 空气隙 + DMF 浴，加权几何平均；经验权重，只排先后。","rows":[{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6 mL/h","mods":"气隙+DMF","idx":"0.927"},{"needle":"24G","conc":"12 wt%","bath":"醇 6:4","q":"6 mL/h","mods":"气隙+DMF","idx":"0.911"},{"needle":"24G","conc":"10 wt%","bath":"纯水","q":"6 mL/h","mods":"气隙+DMF","idx":"0.911"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"15 mL/h","mods":"气隙+DMF","idx":"0.899"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6 mL/h","mods":"仅 DMF 浴","idx":"0.898"},{"needle":"30G","conc":"10 wt%","bath":"醇 6:4","q":"6 mL/h","mods":"气隙+DMF","idx":"0.842"}]}],"analysis":[{"date":"2026-11-05","kind":"待核","title":"第一批原始方案：结果与一个待核点","points":["B3（24G / 12 wt% / 纯水 / 6.2 mL/h）：成腔。第一批里唯一的成功。","B4（24G / 12 wt% / 水:乙醇 6:4 / 6.2 mL/h）：实心。","A4（30G / 10 wt% / 水:乙醇 6:4 / 6.2 mL/h）：实心。","C（30G / 15 wt% / 水:乙醇 6:4 / 15 mL/h）：实心。","待核：口述「乙醇浴那组成」与日志「纯水浴那组成」相反，等原始记录/照片确认。确认前，浴型相关的结论不要写进论文。"]},{"date":"2026-11-05","kind":"结论","title":"30G 四条全实心：卡在哪","points":["壁太薄：30G 外径 0.31 / 内径 0.16，壁厚约 0.075 mm；24G 约 0.11 mm。凝固时间与壁厚平方成正比，30G 快近一倍——壳还没长硬，内层已经塌了。","没有内压支撑：单孔无内注，腔全靠外层壳自己定型。24G 壳够厚撑得住；30G 壳太薄，一收缩直接回实心。","剪切与回弹：30G 在 6.2 mL/h 时壁面剪切约 4×10³ s⁻¹，链被拉直，出针口横向回弹把本来就小的腔压没。","泵余量：10 wt% + 6.2 mL/h 需 2.8 bar，虽在 5 bar 内但没富余，流量一抖射流就断。","合起来看：30G 单孔 + 无内注，在 TPU/DMF 体系下基本走不通，不是浓度没选对。"]},{"date":"2026-11-05","kind":"结论","title":"24G 成、乙醇浴不成：一个方向性的反转","points":["成腔要的不是「凝固越慢越好」，而是「凝固前沿有梯度」：外层先结硬壳、内层还是液体，壳硬了才撑得住收缩让出来的腔。","纯水：结皮快、梯度陡 → 有壳 → 成腔。","40% 乙醇：内外一起减速，梯度被抹平 → 没壳 → 不成腔。","推论：DMF 浴干的是同一件事（降活度、减速），减过头同样抹平梯度。第二批的 DMF 从 5 vol% 起，不要直接 10 vol%。"]},{"date":"2026-11-06","kind":"计划","title":"第二批怎么打","points":["主攻：24G / 12 wt% / 纯水 / 6.2 mL/h + 空气隙 5 mm。空气隙与水浴同向——都给外壳争取时间，不改变梯度方向。","对照：同组改 DMF 5 vol% 浴，看梯度是被加强还是被抹平。","一次只动一个变量：空气隙和 DMF 分开做，两个一起上，出事分不清是谁的锅。","30G 不再单孔纯浴硬试。要 30G 出腔，走内注（自制同轴）或产氢法（NaBH₄ + HCl 浴，见文献 n20）。"]},{"date":"2026-11-05","kind":"思路","title":"如果浴型结论被证实是反的","points":["「延迟分相有利成腔」这条要降权，模型里的 S3/S9 方向要跟着翻。","下一步把「凝固前沿梯度」做成显式因子，而不是拿「凝固快慢」当代理。","模型只是排先后，方向错了要跟着实验改，不能反过来拿模型去解释实验。"]}],"docs":[{"name":"示意图 · 同轴湿纺制备 CT 中空多孔纤维（Word）","url":"lab/files/示意图-中空纤维湿法纺丝.docx"},{"name":"一周方案 30G 与 24G 模拟表（Excel）","url":"lab/files/一周方案-30G与24G针头模拟.xlsx"}]};

const $ = (id) => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPlan(){
  const list = LOGS.plan || [];
  $('plan-list').innerHTML = list.map(p => `
    <div class="card">
      <div class="head">
        <span class="title">${esc(p.id)}　${esc(p.needle)}</span>
        <span class="tag do">待做</span>
      </div>
      <div class="params">
        原液 <code>${esc(p.conc)}</code>　凝固浴 <code>${esc(p.bath)}</code>　流速 <code>${esc(p.q)}</code>
        ${p.mods ? '　改进 <code>'+esc(p.mods)+'</code>' : ''}
      </div>
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    </div>`).join('') || '<div class="card">暂无预备实验。</div>';
  $('n-plan').textContent = list.length;
}

function renderDone(){
  const list = LOGS.done || [];
  const tagCls = (s) => s === '成功' ? 'ok' : s === '未成功' ? 'bad' : 'do';
  $('done-list').innerHTML = list.map(d => `
    <div class="card">
      <div class="head">
        <span class="title">${esc(d.date)}　${esc(d.title)}</span>
        <span class="tag ${tagCls(d.status)}">${esc(d.status)}</span>
      </div>
      <div class="params">${esc(d.detail)}</div>
      ${d.result ? `<div class="note">结果：${esc(d.result)}</div>` : ''}
    </div>`).join('') || '<div class="card">还没有已做实验的记录。</div>';
  $('n-done').textContent = list.length;
}

function renderSim(){
  const list = LOGS.sim || [];
  $('sim-list').innerHTML = list.map(s => {
    const rows = (s.rows || []).map((r, i) => `
      <tr class="${i === 0 ? 'best' : ''}">
        <td>${esc(r.needle)}</td><td>${esc(r.conc)}</td><td>${esc(r.bath)}</td>
        <td>${esc(r.q)}</td><td>${esc(r.mods)}</td>
        <td class="num">${esc(r.idx)}</td>
      </tr>`).join('');
    return `
      <div class="card">
        <div class="head">
          <span class="title">${esc(s.title)}</span>
          <span class="meta">${esc(s.date)}</span>
        </div>
        ${s.desc ? `<div class="note">${esc(s.desc)}</div>` : ''}
        <table style="margin-top:10px">
          <thead><tr><th>针头</th><th>浓度</th><th>凝固浴</th><th>流速</th><th>改进</th><th class="num">指数</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('') || '<div class="card">暂无模拟数据。</div>';
  $('n-sim').textContent = list.reduce((a, s) => a + (s.rows || []).length, 0);
}

function renderAnalysis(){
  const list = LOGS.analysis || [];
  const kindCls = (k) => (k === '已验证' || k === '结论') ? 'ok' : (k === '待核' || k === '计划') ? 'do' : 'bad';
  $('analysis-list').innerHTML = list.map(a => `
    <div class="card">
      <div class="head">
        <span class="title">${esc(a.title)}</span>
        <span class="tag ${kindCls(a.kind)}">${esc(a.kind)}</span>
      </div>
      <div class="meta">${esc(a.date)}</div>
      <ul class="points">${(a.points || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </div>`).join('') || '<div class="card">还没有分析记录。</div>';
}

function renderNotes(){
  const list = LOGS.notes || [];
  const el = document.getElementById('notes-list');
  if(!el) return;
  el.innerHTML = list.map(([k, v]) => `<div class="card" style="padding:10px 14px"><div class="params"><b>${esc(k)}</b>　${esc(v)}</div></div>`).join('')
    || '<div class="card">暂无要点。</div>';
}

function renderDocs(){
  const list = LOGS.docs || [];
  $('doc-list').innerHTML = list.map(d => `<a href="${esc(d.url)}">${esc(d.name)}</a>`).join('')
    || '暂无附件。';
}

$('updated').textContent = LOGS.updated || '—';
renderPlan(); renderDone(); renderNotes(); renderSim(); renderAnalysis(); renderDocs();
</script>
</body>
