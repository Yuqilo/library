<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中空纤维实验日志 · 大肥鱼账本</title>
<style>
  :root{
    --bg:#f7f5f0;--paper:#fffdf9;--ink:#23303d;--muted:#70808f;
    --line:#e2ddd3;--navy:#1f4e79;--teal:#2a9d8f;--amber:#c98a2e;--red:#b5443c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.75}
  header{background:linear-gradient(135deg,#1f4e79,#123a5c);color:#fff;padding:34px 22px 26px}
  .wrap{max-width:1000px;margin:0 auto}
  header h1{margin:0;font-size:26px;letter-spacing:2px}
  header .sub{opacity:.82;font-size:13px;margin-top:6px;letter-spacing:1px}
  .stats{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;font-size:13px;opacity:.9}
  .stats b{font-size:18px;color:#ffd76a}
  main{max-width:1000px;margin:0 auto;padding:22px 22px 60px}
  section{margin-top:26px}
  h2{font-size:17px;color:var(--navy);border-left:4px solid var(--teal);padding-left:10px;margin:0 0 12px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:8px;
        padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .card .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .card .title{font-weight:700;font-size:15px}
  .tag{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap;border:1px solid}
  .tag.do{color:var(--amber);border-color:#efd9b4;background:#fdf6ea}
  .tag.ok{color:var(--teal);border-color:#bfe3dc;background:#eefaf7}
  .tag.bad{color:var(--red);border-color:#f0cfcc;background:#fdf0ef}
  .meta{color:var(--muted);font-size:12px;margin-top:4px}
  .params{margin:8px 0 0;font-size:13px;color:#33424f}
  .params code{background:#f2efe9;padding:1px 5px;border-radius:4px;font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--paper);
        border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
  th{background:#eef2f6;color:var(--navy);font-weight:700;font-size:12px}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .best{background:#eefaf7}
  .links a{display:inline-block;margin:3px 10px 3px 0;color:var(--navy);font-size:13px}
  footer{max-width:1000px;margin:0 auto;padding:0 22px 40px;color:var(--muted);font-size:12px}
  .note{font-size:12px;color:var(--muted);margin-top:6px}
  .points{margin:8px 0 0;padding-left:20px;font-size:13px;color:#33424f}
  .points li{margin:5px 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>中空纤维实验日志</h1>
    <div class="sub">扬州大学电能学院 · 热动课题组 · TPU 30G 针头极细中空纤维</div>
    <div class="stats">
      <span>预备 <b id="n-plan">0</b> 项</span>
      <span>已做 <b id="n-done">0</b> 项</span>
      <span>模拟 <b id="n-sim">0</b> 组</span>
      <span>更新于 <b id="updated">—</b></span>
    </div>
  </div>
</header>
<main>
  <section id="plan">
    <h2>预备实验（待做）</h2>
    <div id="plan-list"></div>
  </section>
  <section id="done">
    <h2>已做实验（成功 / 未成功）</h2>
    <div id="done-list"></div>
  </section>
  <section id="notes">
    <h2>操作要点</h2>
    <div id="notes-list"></div>
  </section>
  <section id="sim">
    <h2>模拟与数据</h2>
    <div id="sim-list"></div>
  </section>
  <section id="analysis">
    <h2>实验总结与失败分析</h2>
    <div id="analysis-list"></div>
  </section>
  <section id="docs">
    <h2>文档与附件</h2>
    <div class="card links" id="doc-list"></div>
  </section>
</main>
<footer>
  <div>本页由大肥鱼维护 · 每次实验后更新，重开即是最新；表格中的指数是经验权重打分，只排先后，不是精确预测。</div>
</footer>
<script>
const LOGS = {"updated":"2026-11-05 19:12","plan":[{"id":"1","needle":"24G（内径 0.34 mm）","conc":"12 wt%","bath":"去离子水 500 mL · 室温","q":"6.2 mL/h","mods":"气隙 5 mm + DMF 5%","note":"主推：气隙与 DMF 一起上（0.921）。一次只动一个变量的前提下它是「试」，成败都要记。"},{"id":"2","needle":"24G（内径 0.34 mm）","conc":"12 wt%","bath":"去离子水 · 室温","q":"6.2 mL/h","mods":"气隙 0 mm（贴液面）+ DMF 5%","note":"气隙对照：只差这 5 mm，看气隙到底有没有用（0.894）。"},{"id":"3","needle":"24G（内径 0.34 mm）","conc":"12 wt%","bath":"去离子水 · 室温","q":"6.2 mL/h","mods":"气隙 5 mm + 无 DMF","note":"DMF 对照：只差浴里那点 DMF，看它是不是真在起作用（0.872）。"},{"id":"4","needle":"24G（内径 0.34 mm）","conc":"10 wt%","bath":"去离子水 · 室温","q":"6.2 mL/h","mods":"气隙 5 mm + DMF 5%","note":"低浓度加测：10 wt% 下同样两改进（0.913），与第 1 组比浓度。"},{"id":"5","needle":"24G（内径 0.34 mm）","conc":"12 wt%","bath":"乙醇:去离子水 = 6:4","q":"6.2 mL/h","mods":"气隙 5 mm + 无 DMF","note":"反向对照：验证「梯度说」，不是主推（0.774）。"}],"notes":[["溶液","TPU 9313 / DMF，12 wt%（第 4 组换 10 wt%）；搅拌充分后脱泡到没有气泡，装针前过一遍滤。"],["针头","24G 不锈钢点胶针，内径 0.34 mm，针管 13 mm。"],["泵","注射泵 6.2 mL/h；24G 只需 0.26 bar，泵很轻松。"],["凝固浴","去离子水 500 mL 烧杯，室温（第 5 组换乙醇:水 = 6:4）。"],["空气隙","针口离液面 5 mm，垂直对着液面；第 2 组贴液面做对照。"],["入浴","入浴后停 30 秒以上再收丝，别急着拉。"],["收丝","手动或导丝轮，牵引比 1.0–1.5；让腔撑住优先，不要一味拉细。"],["取样","每组至少 3 根；液氮脆断或切片看断面，别用剪刀剪。"],["看什么","是否中空、壁厚、外径（3 根取平均）；射流是否稳定、有无断丝和气泡；断面异常就拍照——皮层厚、大空穴、内腔是否连续。"],["两句提醒","一次只动一个变量：第 1 组同时上气隙和 DMF 只是「试」，第 2、3 组才是拆开看谁在起作用；DMF 从 5% 起；乙醇那组（第 5 组）是反向对照，不是主推。"]],"done":[{"date":"2026-11-05","title":"原始方案 · B3（24G，12 wt%，纯水，6.2 mL/h）","status":"成功","detail":"未加空气隙、未加 DMF 浴的原始条件。24G 单孔，TPU/DMF 12 wt%，去离子水浴，6.2 mL/h。","result":"确认中空纤维——成腔成立。今天唯一成功的一组（纯水浴）。"},{"date":"2026-11-05","title":"原始方案 · A4（30G，10 wt%，水:乙醇 6:4，6.2 mL/h）","status":"未成功","detail":"未加空气隙、未加 DMF 浴。30G 单孔，水:乙醇 6:4 凝固浴，6.2 mL/h。","result":"实心，无腔。"},{"date":"2026-11-05","title":"原始方案 · B4（24G，12 wt%，水:乙醇 6:4，6.2 mL/h）","status":"未成功","detail":"未加空气隙、未加 DMF 浴。24G 单孔，水:乙醇 6:4 凝固浴，6.2 mL/h。","result":"实心，无腔。40% 乙醇浴反而没成。"},{"date":"2026-11-05","title":"原始方案 · C 对照（30G，15 wt%，水:乙醇 6:4，15 mL/h）","status":"未成功","detail":"未加空气隙、未加 DMF 浴。30G 单孔，15 wt% TPU/DMF，水:乙醇 6:4 凝固浴，15 mL/h。","result":"实心，与 2026-11-04 的记录一致。"},{"date":"2026-11-04","title":"理论补课：相转化 / 干-湿纺 / 溶剂-非溶剂","status":"成功","detail":"读《膜技术基本原理》第 2 版（Mulder 著，清华大学出版社 1999；PDF 页 = 书页 + 15），梳理相转化五法、喷丝头与空气隙、凝固浴作用。","result":"建立 hollow-fiber 知识库理论支（5 条），后续实验按此校准。"}],"sim":[{"date":"2026-11-06 实验单","title":"明日五组（24G 主攻 · 空气隙 × DMF 双变量）","desc":"指数为模拟预测，按此排序动手；第 2、3 组是拆开看谁在起作用的对照。","rows":[{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6.2","mods":"气隙5 + DMF5%","idx":"0.921"},{"needle":"24G","conc":"10 wt%","bath":"纯水","q":"6.2","mods":"气隙5 + DMF5%","idx":"0.913"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6.2","mods":"气隙0 + DMF5%","idx":"0.894"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6.2","mods":"气隙5 + 无DMF","idx":"0.872"},{"needle":"24G","conc":"12 wt%","bath":"醇6:4","q":"6.2","mods":"气隙5 + 无DMF","idx":"0.774"}]},{"date":"2026-11-05","title":"两改进叠加 · 可行性排序（前 8，校准前）","desc":"指数 = 六因子 + 空气隙 + DMF 浴，加权几何平均；经验权重，只排先后。","rows":[{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6 mL/h","mods":"气隙+DMF","idx":"0.927"},{"needle":"24G","conc":"12 wt%","bath":"醇 6:4","q":"6 mL/h","mods":"气隙+DMF","idx":"0.911"},{"needle":"24G","conc":"10 wt%","bath":"纯水","q":"6 mL/h","mods":"气隙+DMF","idx":"0.911"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"15 mL/h","mods":"气隙+DMF","idx":"0.899"},{"needle":"24G","conc":"12 wt%","bath":"纯水","q":"6 mL/h","mods":"仅 DMF 浴","idx":"0.898"},{"needle":"30G","conc":"10 wt%","bath":"醇 6:4","q":"6 mL/h","mods":"气隙+DMF","idx":"0.842"}]}],"analysis":[{"date":"2026-11-05","kind":"已验证","title":"第一批原始方案：只有 24G 纯水浴成腔","points":["B3（24G / 12 wt% / 纯水 / 6.2 mL/h）：成腔。今天唯一成功的一组。","B4（24G / 12 wt% / 水:乙醇 6:4 / 6.2 mL/h）：实心。","A4（30G / 10 wt% / 水:乙醇 6:4 / 6.2 mL/h）：实心。","C（30G / 15 wt% / 水:乙醇 6:4 / 15 mL/h）：实心。","同一根 24G 针、同一浓度和流量：纯水成、乙醇不成——浴型是这一批里最硬的变量。"]},{"date":"2026-11-05","kind":"结论","title":"纯水成、乙醇不成：成腔要的是「梯度」不是「慢」","points":["成腔要求外层先结成壳、内层还是液体；壳硬了，才撑得住收缩让出来的腔。","纯水：结皮快、梯度陡 → 有壳 → 成腔。","40% 乙醇：内外一起减速，梯度被抹平 → 没壳 → 不成腔。","这与「降低相转化速度就好」的直觉相反：慢不是目的，内外不同步才是。","推论：DMF 浴干的是同一件事（降活度、减速），加多了同样有抹平梯度的风险，所以从 5 vol% 起步。"]},{"date":"2026-11-05","kind":"结论","title":"30G 三条全实心：卡在尺度上","points":["壁太薄：30G 外径 0.31 / 内径 0.16，壁厚约 0.075 mm；24G 约 0.11 mm。凝固时间与壁厚平方成正比，30G 快近一倍，壳还没硬内层已经塌。","没有内压支撑：单孔无内注，腔全靠外层壳定型；30G 壳太薄，一收缩就回实心。","剪切与回弹：30G 在 6.2 mL/h 时壁面剪切约 4×10³ s⁻¹，链被拉直，出针口横向回弹把腔压小。","泵余量：10 wt% + 6.2 mL/h 需 2.8 bar，虽在 5 bar 内但没富余，流量一抖射流就断。","结论：30G 单孔 + 无内注，在 TPU/DMF 体系下走不通。要 30G 出腔得换机制（内注 / 产氢）。"]},{"date":"2026-11-06","kind":"计划","title":"第二批怎么打（基于纯水成功组合）","points":["基线抄今天的成功：24G / 12 wt% / 纯水 / 6.2 mL/h。","主攻 A：同组加空气隙 5 mm——空气隙就是「先给外壳一点时间」，和水浴同向，不改变梯度方向。","主攻 B：同组加 DMF 5 vol% 浴，看降活性到底帮不帮忙（有抹平梯度的风险，所以只加 5）。","主攻 C：两者叠加（气隙 5 mm + DMF 5 vol%）。","乙醇浴继续做对照：既然乙醇那组实心，本轮再用一次「乙醇 + 气隙」组合验证是否真的反向。","一次只动一个变量：空气隙和 DMF 分开做，两个一起上出事分不清是谁的锅。"]}],"docs":[{"name":"示意图 · 同轴湿纺制备 CT 中空多孔纤维（Word）","url":"lab/files/示意图-中空纤维湿法纺丝.docx"},{"name":"一周方案 30G 与 24G 模拟表（Excel）","url":"lab/files/一周方案-30G与24G针头模拟.xlsx"}]};

const $ = (id) => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPlan(){
  const list = LOGS.plan || [];
  $('plan-list').innerHTML = list.map(p => `
    <div class="card">
      <div class="head">
        <span class="title">${esc(p.id)}　${esc(p.needle)}</span>
        <span class="tag do">待做</span>
      </div>
      <div class="params">
        原液 <code>${esc(p.conc)}</code>　凝固浴 <code>${esc(p.bath)}</code>　流速 <code>${esc(p.q)}</code>
        ${p.mods ? '　改进 <code>'+esc(p.mods)+'</code>' : ''}
      </div>
      ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    </div>`).join('') || '<div class="card">暂无预备实验。</div>';
  $('n-plan').textContent = list.length;
}

function renderDone(){
  const list = LOGS.done || [];
  const tagCls = (s) => s === '成功' ? 'ok' : s === '未成功' ? 'bad' : 'do';
  $('done-list').innerHTML = list.map(d => `
    <div class="card">
      <div class="head">
        <span class="title">${esc(d.date)}　${esc(d.title)}</span>
        <span class="tag ${tagCls(d.status)}">${esc(d.status)}</span>
      </div>
      <div class="params">${esc(d.detail)}</div>
      ${d.result ? `<div class="note">结果：${esc(d.result)}</div>` : ''}
    </div>`).join('') || '<div class="card">还没有已做实验的记录。</div>';
  $('n-done').textContent = list.length;
}

function renderSim(){
  const list = LOGS.sim || [];
  $('sim-list').innerHTML = list.map(s => {
    const rows = (s.rows || []).map((r, i) => `
      <tr class="${i === 0 ? 'best' : ''}">
        <td>${esc(r.needle)}</td><td>${esc(r.conc)}</td><td>${esc(r.bath)}</td>
        <td>${esc(r.q)}</td><td>${esc(r.mods)}</td>
        <td class="num">${esc(r.idx)}</td>
      </tr>`).join('');
    return `
      <div class="card">
        <div class="head">
          <span class="title">${esc(s.title)}</span>
          <span class="meta">${esc(s.date)}</span>
        </div>
        ${s.desc ? `<div class="note">${esc(s.desc)}</div>` : ''}
        <table style="margin-top:10px">
          <thead><tr><th>针头</th><th>浓度</th><th>凝固浴</th><th>流速</th><th>改进</th><th class="num">指数</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }).join('') || '<div class="card">暂无模拟数据。</div>';
  $('n-sim').textContent = list.reduce((a, s) => a + (s.rows || []).length, 0);
}

function renderAnalysis(){
  const list = LOGS.analysis || [];
  const kindCls = (k) => (k === '已验证' || k === '结论') ? 'ok' : (k === '待核' || k === '计划') ? 'do' : 'bad';
  $('analysis-list').innerHTML = list.map(a => `
    <div class="card">
      <div class="head">
        <span class="title">${esc(a.title)}</span>
        <span class="tag ${kindCls(a.kind)}">${esc(a.kind)}</span>
      </div>
      <div class="meta">${esc(a.date)}</div>
      <ul class="points">${(a.points || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    </div>`).join('') || '<div class="card">还没有分析记录。</div>';
}

function renderNotes(){
  const list = LOGS.notes || [];
  const el = document.getElementById('notes-list');
  if(!el) return;
  el.innerHTML = list.map(([k, v]) => `<div class="card" style="padding:10px 14px"><div class="params"><b>${esc(k)}</b>　${esc(v)}</div></div>`).join('')
    || '<div class="card">暂无要点。</div>';
}

function renderDocs(){
  const list = LOGS.docs || [];
  $('doc-list').innerHTML = list.map(d => `<a href="${esc(d.url)}">${esc(d.name)}</a>`).join('')
    || '暂无附件。';
}

$('updated').textContent = LOGS.updated || '—';
renderPlan(); renderDone(); renderNotes(); renderSim(); renderAnalysis(); renderDocs();
</script>
</body>
</html>
